media:
  input: assets/img
  output: /assets/img

content:
  - name: posts
    label: 전체글
    type: collection
    path: _posts
    format: yaml-frontmatter

    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create

    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: 제목
        type: string
        required: true

      - name: date
        label: 작성일
        type: date
        options:
          format: yyyy-MM-dd

      - name: slug
        label: 주소
        type: string
        description: "글 주소에 쓰일 번호나 짧은 이름 (예: 3 → notice.kuguitar.com/3/). 다른 글과 겹치지 않게. 비우면 파일 이름으로 자동 생성"

      - name: tags
        label: 태그
        type: string

      - name: body
        label: 본문
        type: rich-text

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
